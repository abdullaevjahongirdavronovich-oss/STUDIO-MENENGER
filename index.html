<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Records - Studio Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studioDark: '#0f172a',
                        studioCard: '#1e293b',
                        studioBorder: '#334155'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-studioDark text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-studioCard p-6 rounded-2xl border border-studioBorder shadow-xl">
            <div>
                <h1 class="text-3xl font-black tracking-wider bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">JM Records</h1>
                <p class="text-sm font-semibold text-purple-400 mt-1">Studiya Boshqaruv Tizimi</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="alert('Mijoz qo\'shish oynasi ochildi!')" class="flex-1 md:flex-none bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-purple-900/40 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Yangi Mijoz
                </button>
            </div>
        </header>

        <!-- Statistika kartochkalari -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-studioCard p-5 rounded-2xl border border-studioBorder shadow-lg">
                <p class="text-slate-400 text-xs font-bold uppercase">Ovoz yozishda</p>
                <h3 class="text-2xl font-black text-red-400 mt-1">1 ta</h3>
            </div>
            <div class="bg-studioCard p-5 rounded-2xl border border-studioBorder shadow-lg">
                <p class="text-slate-400 text-xs font-bold uppercase">Mixing jarayonida</p>
                <h3 class="text-2xl font-black text-purple-400 mt-1">2 ta</h3>
            </div>
            <div class="bg-studioCard p-5 rounded-2xl border border-studioBorder shadow-lg">
                <p class="text-slate-400 text-xs font-bold uppercase">Muddati o'tgan (Expired)</p>
                <h3 class="text-2xl font-black text-red-500 mt-1">0 ta</h3>
            </div>
            <div class="bg-studioCard p-5 rounded-2xl border border-studioBorder shadow-lg">
                <p class="text-slate-400 text-xs font-bold uppercase">Tugallangan</p>
                <h3 class="text-2xl font-black text-green-400 mt-1">4 ta</h3>
            </div>
        </div>

        <!-- Mijozlar jadvali -->
        <div class="bg-studioCard rounded-2xl border border-studioBorder shadow-xl overflow-hidden">
            <div class="p-6 border-b border-studioBorder flex justify-between items-center">
                <h3 class="font-bold text-lg">Faol Mijozlar</h3>
                <span class="text-xs bg-purple-900/60 text-purple-300 px-3 py-1 rounded-full font-semibold">Ijara: 3,000,000 UZS</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-studioBorder text-xs text-slate-400 uppercase bg-slate-900/40">
                            <th class="p-4">Mijoz / Trek</th>
                            <th class="p-4">Holati</th>
                            <th class="p-4">Sana & Deadline</th>
                            <th class="p-4 text-right">Amallar</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-studioBorder text-sm">
                        <tr class="hover:bg-slate-800/50 transition">
                            <td class="p-4 font-bold">Jasur - "Yomg'irlar"</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30">Ovoz yozish</span></td>
                            <td class="p-4 text-slate-300">20.10.2026</td>
                            <td class="p-4 text-right">
                                <button class="text-slate-400 hover:text-white px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                            </td>
                        </tr>
                        <tr class="hover:bg-slate-800/50 transition">
                            <td class="p-4 font-bold">Sardor - "Tun"</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30">Mixing</span></td>
                            <td class="p-4 text-slate-300">Deadline: 3 kun</td>
                            <td class="p-4 text-right">
                                <button class="text-slate-400 hover:text-white px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
